<style>
  :root {

  .wrap { width: 100%; max-width: 1960px; position: relative; }
  svg#clash-svg {
    width: 100%;
    height: auto;
    display: block;
    background: var(--bg);
    border-radius: 12px;
    user-select: none;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding: 9px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
  }
  body.embed-minimal .controls { display: none; }
  .btn-group { display: flex; align-items: center; gap: 6px; }
  button {
    background: #F1F4F9;
    color: var(--ink);
    border: 1px solid #C8D1DF;
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  button:hover { background: #E4EBF5; border-color: #9FB0C9; }
  button.primary { background: var(--ink); color: #FFF; border-color: var(--ink); min-width: 82px; }
  button.primary:hover { background: #2E323B; }
  button.active { background: var(--blue); color: #FFF; border-color: var(--blue); }
  .scrubber-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 240px;
    max-width: 720px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--blue);
    cursor: pointer;
  }
  .mono-lbl {
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace;
    font-weight: 700;
    font-size: 12.5px;
    min-width: 68px;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    display: none;
    background: rgba(24, 26, 31, 0.94);
    color: #FFF;
    padding: 8px 11px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.45;
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    z-index: 50;
  }
</style>

  const layerMap = new Map();
  D.cols.forEach(([ly, _], ci) => {
    if (!layerMap.has(ly)) layerMap.set(ly, []);
    layerMap.get(ly).push(ci);
  });
  let prevEnd = -1;
  for (const [ly, list] of layerMap.entries()) {
    const c0 = list[0], c1 = list[list.length - 1];
    if (prevEnd >= 0) {
      const bxDiv = 0.5 * (D.xs[prevEnd] + D.xs[c0]);
      el("line", { x1: bxDiv, y1: AR_TOP + 10, x2: bxDiv, y2: AR_BOT - 10, stroke: "#D2DAE6", "stroke-width": 1.5 });
    }
    const midLx = 0.5 * (D.xs[c0] + D.xs[c1]);
    const lbl = el("text", { x: midLx, y: 201, "text-anchor": "middle", fill: "#181A1F", "font-size": 13.5, "font-weight": 700 });
    lbl.textContent = (D.xs[c1] - D.xs[c0] + pitch >= 66) ? `Layer ${ly}` : `L${ly}`;
    prevEnd = c1;
  }

  // Emitter Bars
  el("rect", { x: 68, y: Y_CAMP_A0, width: W - 136, height: Y_CAMP_A1 - Y_CAMP_A0, rx: 7, fill: "#EBF4FF", stroke: "#B9D6FC", "stroke-width": 1.5 });
  el("text", { x: 88, y: 236, fill: "#1967D2", "font-size": 14, "font-weight": 700 }).textContent = "PLAYER A (BLUE AGENT)   ▲  Pulls physical neurons UP (+STEER)";
  el("rect", { x: 68, y: Y_CAMP_B0, width: W - 136, height: Y_CAMP_B1 - Y_CAMP_B0, rx: 7, fill: "#FFF0EC", stroke: "#FCC6C0", "stroke-width": 1.5 });
  el("text", { x: 88, y: 722, fill: "#E04826", "font-size": 14, "font-weight": 700 }).textContent = "PLAYER B (RED AGENT)    ▼  Pulls physical neurons DOWN (−STEER)";

  // Territory Tints & Side Labels
  el("rect", { x: X_LEFT, y: slotTop - 10, width: X_RIGHT - X_LEFT, height: Y_MID - (slotTop - 10), fill: "#F8FBFF" });
  el("rect", { x: X_LEFT, y: Y_MID, width: X_RIGHT - X_LEFT, height: (slotBot + 10) - Y_MID, fill: "#FFF9F8" });

  function sideLabel(yBase, lines, col, size = 13.5, dy = 16) {
    const t = el("text", { x: 104, y: yBase, "text-anchor": "middle", fill: col, "font-size": size, "font-weight": 700 });
    lines.forEach((s, i) => {
      const sp = el("tspan", { x: 104, dy: i === 0 ? 0 : dy }, t);
      sp.textContent = s;
    });
  }
  sideLabel(Y_MID - 104, ["BLUE", "TERRITORY", "(+A)"], "#1967D2");
  sideLabel(Y_MID - 3, ["0.0", "NEUTRAL"], "#181A1F", 11.5, 14);
  sideLabel(Y_MID + 78, ["RED", "TERRITORY", "(−B)"], "#E04826");

  // Per-Column SVG Nodes
  const tickSet = new Set(D.tick_idxs);
  const colNodes = [];
  const gTracks = el("g");
  const gDynamic = el("g");
  const gHover = el("g");
  const tooltip = document.getElementById("tooltip");
  let hoveredIdx = -1;

  for (let ci = 0; ci < nC; ci++) {
    const px = D.xs[ci];
    const isLbl = tickSet.has(ci);
    const trk = el("rect", {
      x: px - pistonHW, y: slotTop, width: 2 * pistonHW, height: slotBot - slotTop,
      rx: 3, fill: "#EDF1F7", stroke: "#C4CEDC", "stroke-width": 1
    }, gTracks);
    el("line", {
      x1: px, y1: Y_CAMP_B1 + 2, x2: px, y2: Y_CAMP_B1 + 2 + (isLbl ? 9 : 4),
      stroke: isLbl ? "#181A1F" : "#B4BCC8", "stroke-width": isLbl ? 1.8 : 1
    }, gTracks);
    if (isLbl) {
      const [ly, co] = D.cols[ci];
      el("text", { x: px, y: Y_CAMP_B1 + 24, "text-anchor": "middle", fill: "#181A1F", "font-family": "monospace", "font-size": 11.5, "font-weight": 700 }, gTracks).textContent = `L${ly}`;
      el("text", { x: px, y: Y_CAMP_B1 + 39, "text-anchor": "middle", fill: "#5F6368", "font-family": "monospace", "font-size": 10.8 }, gTracks).textContent = `c${co}`;
    }

    const ghost = el("rect", { x: px - barHW + 0.8, y: Y_MID, width: 2 * (barHW - 0.8), height: 0, rx: 2, display: "none" }, gDynamic);
    const bar   = el("rect", { x: px - barHW, y: Y_MID, width: 2 * barHW, height: 0, rx: 2.2, display: "none" }, gDynamic);

    // Blue cable group
    const gA = el("g", { display: "none" }, gDynamic);
    const glowA = el("line", { x1: px, y1: Y_MID, x2: px, y2: shaftA, stroke: "#A5CEFC", "stroke-width": 5.2, opacity: 0.65 }, gA);
    const lineA = el("line", { x1: px, y1: Y_MID, x2: px, y2: shaftA, stroke: "#1967D2", "stroke-width": wBeam }, gA);
    const dotA  = el("circle", { cx: px, cy: Y_MID, r: 2.2, fill: "#1967D2" }, gA);
    const polyA = el("polygon", { fill: "#1967D2" }, gA);

    // Red cable group
    const gB = el("g", { display: "none" }, gDynamic);
    const glowB = el("line", { x1: px, y1: Y_MID, x2: px, y2: shaftB, stroke: "#FCB4A5", "stroke-width": 5.2, opacity: 0.65 }, gB);
    const lineB = el("line", { x1: px, y1: Y_MID, x2: px, y2: shaftB, stroke: "#E04826", "stroke-width": wBeam }, gB);
    const dotB  = el("circle", { cx: px, cy: Y_MID, r: 2.2, fill: "#E04826" }, gB);
    const polyB = el("polygon", { fill: "#E04826" }, gB);

    const brk = el("path", {
      d: bracketPath(px - pistonHW - 2.2, slotTop - 4, px + pistonHW + 2.2, slotBot + 4, brArm),
      fill: "none", "stroke-width": 2, display: "none"
    }, gDynamic);

    // Invisible hover hitbox
    const hit = el("rect", {
      x: px - pitch * 0.5, y: Y_CAMP_A1, width: pitch, height: Y_CAMP_B0 - Y_CAMP_A1,
      fill: "transparent", style: "cursor:crosshair;"
    }, gHover);
    hit.addEventListener("mouseenter", () => { hoveredIdx = ci; trk.setAttribute("stroke", "#181A1F"); trk.setAttribute("stroke-width", "2"); });
    hit.addEventListener("mouseleave", () => { hoveredIdx = -1; tooltip.style.display = "none"; trk.setAttribute("stroke", "#C4CEDC"); trk.setAttribute("stroke-width", "1"); });
    hit.addEventListener("mousemove", (ev) => {
      tooltip.style.left = (ev.clientX + 14) + "px";
      tooltip.style.top  = (ev.clientY - 18) + "px";
    });

    colNodes.push({ px, ghost, bar, gA, glowA, lineA, dotA, polyA, gB, glowB, lineB, dotB, polyB, brk });
  }

  // 0.0 Neutral Wire & Footer
  el("line", { x1: X_LEFT, y1: Y_MID, x2: X_RIGHT, y2: Y_MID, stroke: "#181A1F", "stroke-width": 2.4 });
  el("text", { x: W/2, y: 833, "text-anchor": "middle", fill: "#181A1F", "font-size": 14, "font-weight": 700 }).textContent =
    `Strict Physical Neuron X-Axis (${nC} Unique MLP Columns: Layer ${D.cols[0][0]}:c${D.cols[0][1]} → Layer ${D.cols[nC-1][0]}:c${D.cols[nC-1][1]})  ·  Blue (▲) & Red (▼) Live STEER Pulls`;
  el("text", { x: W/2, y: 859, "text-anchor": "middle", fill: "#5F6368", "font-size": 12.2 }).textContent =
    "Each vertical channel is ONE physical neuron column  ·  Gold corner brackets = BOTH agents pull the exact same neuron in the same round! (Hover any column to inspect)";

  // Animation State (`playhead` in `[0, 15.99]`)
  let playhead = 1.05;
  let playing = true;
  let speed = 1.0;
  let scrubbing = false;
  const scrubber = document.getElementById("scrubber");
  const lblScrub = document.getElementById("lbl-scrub");

  function renderAt(pos) {
    let rCurr = Math.min(D.depth, Math.floor(pos));
    let frac = pos - rCurr;
    let rPrev, uMove, beamInt;

    if (rCurr === 0) {
      rPrev = 0; uMove = 1.0; beamInt = 0.0;
    } else if (scrubbing) {
      // When dragging slider manually, show crisp round state + full active volley beams
      rPrev = rCurr - 1; uMove = 1.0; beamInt = 0.92;
    } else {
      rPrev = rCurr - 1;
      if (frac < 0.58) {
        const uRaw = frac / 0.58;
        uMove = smoothstep(Math.max(0, (uRaw - 0.10) / 0.90));
        beamInt = uRaw < 0.28 ? (uRaw / 0.28) : (uRaw < 0.72 ? 1.0 : 1.0 - (uRaw - 0.72) / 0.45);
      } else {
        uMove = 1.0;
        const hFrac = (frac - 0.58) / 0.42;
        beamInt = Math.max(0, 0.35 * (1.0 - hFrac / 0.65));
      }
    }

    let nBlue = 0, nRed = 0, nSA = 0, nSB = 0, nCl = 0;
    const vPrevRow = D.signed[rPrev];
    const vCurrRow = D.signed[rCurr];
    const haRow = rCurr > 0 ? D.hit_a[rCurr] : null;
    const hbRow = rCurr > 0 ? D.hit_b[rCurr] : null;

    for (let ci = 0; ci < nC; ci++) {
      const nd = colNodes[ci];
      const v0 = vPrevRow[ci], v1 = vCurrRow[ci];
      const vm = v0 + (v1 - v0) * uMove;
      if (vm > 0.015) nBlue++;
      else if (vm < -0.015) nRed++;

      const ha = haRow ? haRow[ci] : 0;
      const hb = hbRow ? hbRow[ci] : 0;
      if (ha > 0.02) nSA++;
      if (hb > 0.02) nSB++;
      if (ha > 0.02 && hb > 0.02) nCl++;

      // Ghost bar
      if (Math.abs(v0) > 0.05 && Math.abs(v1 - v0) > 0.14 && uMove < 0.96) {
        const pyOld = Y_MID - deflect(v0) * MAX_AMP;
        nd.ghost.setAttribute("display", "inline");
        nd.ghost.setAttribute("y", Math.min(Y_MID, pyOld).toFixed(1));
        nd.ghost.setAttribute("height", Math.abs(pyOld - Y_MID).toFixed(1));
        nd.ghost.setAttribute("fill", v0 > 0 ? "#CCE0FA" : "#FCD4CC");
      } else {
        nd.ghost.setAttribute("display", "none");
      }

      // Current piston bar (zero collar box artifact!)
      let pyNow = Y_MID - deflect(vm) * MAX_AMP;
      if (Math.abs(pyNow - Y_MID) >= 1.8) {
        const mag = Math.min(1, Math.abs(vm) / 0.42);
        const col = vm > 0 ? lerpHex([92,154,238], [25,103,210], mag) : lerpHex([240,126,104], [224,72,38], mag);
        nd.bar.setAttribute("display", "inline");
        nd.bar.setAttribute("y", Math.min(Y_MID, pyNow).toFixed(1));
        nd.bar.setAttribute("height", Math.abs(pyNow - Y_MID).toFixed(1));
        nd.bar.setAttribute("fill", col);
      } else {
        pyNow = Y_MID;
        nd.bar.setAttribute("display", "none");
      }

      // Tug-of-war cables + brackets
      const dual = (ha > 0.02) && (hb > 0.02);
      const xOff = dual ? dualXOff : 0;
      if (beamInt > 0.06 && ha > 0.02) {
        const xa = nd.px - xOff;
        const ya = Math.min(Y_MID, pyNow);
        nd.gA.setAttribute("display", "inline");
        nd.gA.setAttribute("opacity", beamInt.toFixed(2));
        nd.glowA.setAttribute("x1", xa); nd.glowA.setAttribute("x2", xa); nd.glowA.setAttribute("y1", ya.toFixed(1));
        nd.lineA.setAttribute("x1", xa); nd.lineA.setAttribute("x2", xa); nd.lineA.setAttribute("y1", ya.toFixed(1));
        nd.dotA.setAttribute("cx", xa);  nd.dotA.setAttribute("cy", ya.toFixed(1));
        nd.polyA.setAttribute("points", `${xa.toFixed(1)},${tipA.toFixed(1)} ${(xa-headSz*0.78).toFixed(1)},${baseA.toFixed(1)} ${(xa+headSz*0.78).toFixed(1)},${baseA.toFixed(1)}`);
      } else {
        nd.gA.setAttribute("display", "none");
      }

      if (beamInt > 0.06 && hb > 0.02) {
        const xb = nd.px + xOff;
        const yb = Math.max(Y_MID, pyNow);
        nd.gB.setAttribute("display", "inline");
        nd.gB.setAttribute("opacity", beamInt.toFixed(2));
        nd.glowB.setAttribute("x1", xb); nd.glowB.setAttribute("x2", xb); nd.glowB.setAttribute("y1", yb.toFixed(1));
        nd.lineB.setAttribute("x1", xb); nd.lineB.setAttribute("x2", xb); nd.lineB.setAttribute("y1", yb.toFixed(1));
        nd.dotB.setAttribute("cx", xb);  nd.dotB.setAttribute("cy", yb.toFixed(1));
        nd.polyB.setAttribute("points", `${xb.toFixed(1)},${tipB.toFixed(1)} ${(xb-headSz*0.78).toFixed(1)},${baseB.toFixed(1)} ${(xb+headSz*0.78).toFixed(1)},${baseB.toFixed(1)}`);
      } else {
        nd.gB.setAttribute("display", "none");
      }

      const hj = (ha > 0.02 && v0 < -0.08 && v1 > 0.04) || (hb > 0.02 && v0 > 0.08 && v1 < -0.04);
      if (beamInt > 0.06 && (dual || hj)) {
        nd.brk.setAttribute("display", "inline");
        nd.brk.setAttribute("opacity", Math.min(1, beamInt * 1.15).toFixed(2));
        nd.brk.setAttribute("stroke", dual ? "#EA8A00" : (ha > hb ? "#1967D2" : "#E04826"));
      } else {
        nd.brk.setAttribute("display", "none");
      }
    }

    // Scoreboard update
    txtRound.textContent = rCurr === 0 ? "BASE W0" : `ROUND ${String(rCurr).padStart(2, "0")} / 15`;
    txtBlueHeld.textContent = `BLUE HELD: ${String(nBlue).padStart(2, " ")}`;
    txtRedHeld.textContent  = `${String(nRed).padStart(2, " ")} :RED HELD`;

    const bwW = Math.min(1, nBlue / (nC * 0.65)) * gHalf;
    const rwW = Math.min(1, nRed  / (nC * 0.65)) * gHalf;
    barGaugeBlue.setAttribute("x", (gMid - bwW).toFixed(1));
    barGaugeBlue.setAttribute("width", bwW.toFixed(1));
    barGaugeRed.setAttribute("width", rwW.toFixed(1));

    if (rCurr > 0) {
      txtTelem.textContent = `LIVE ROUND ${String(rCurr).padStart(2, "0")} VOLLEY:  ▲ ${nSA} Blue STEER pulls   ·   ▼ ${nSB} Red STEER pulls   ·   ★ ${nCl} Same-Neuron Head-on Clashes`;
      txtTelem.setAttribute("fill", nCl > 0 ? "#EA8A00" : "#5F6368");
    } else {
      txtTelem.textContent = "BASE WEIGHTS W0 (Pre-Battle Equilibrium Across All 100 Contested MLP Columns)";
      txtTelem.setAttribute("fill", "#5F6368");
    }

    lblScrub.textContent = rCurr === 0 ? "BASE W0" : `R${String(rCurr).padStart(2, "0")} / 15`;
    if (!scrubbing) scrubber.value = Math.min(15, pos).toFixed(2);

    if (hoveredIdx >= 0) {
      const [ly, co] = D.cols[hoveredIdx];
      const vm = vPrevRow[hoveredIdx] + (vCurrRow[hoveredIdx] - vPrevRow[hoveredIdx]) * uMove;
      const ha = haRow ? haRow[hoveredIdx] : 0;
      const hb = hbRow ? hbRow[hoveredIdx] : 0;
      tooltip.style.display = "block";
      tooltip.innerHTML =
        `<b>Layer ${ly} · Column c${co}</b> (Slot #${hoveredIdx + 1}/100)<br/>` +
        `Signed Weight: <span style="color:${vm >= 0 ? '#7AB4FF' : '#FF9E8A'}">${vm >= 0 ? '+' : ''}${vm.toFixed(3)}</span><br/>` +
        `Round ${rCurr} Pulls: <span style="color:#7AB4FF">▲ Blue ${ha.toFixed(2)}</span> · <span style="color:#FF9E8A">▼ Red ${hb.toFixed(2)}</span>` +
        ((ha > 0.02 && hb > 0.02) ? `<br/><span style="color:#FFB74D">★ HEAD-ON SAME-NEURON CLASH!</span>` : "");
    }
  }

  // Controls
  const btnPlay = document.getElementById("btn-play");
  btnPlay.addEventListener("click", () => {
    playing = !playing;
    btnPlay.textContent = playing ? "⏸ Pause" : "▶ Play";
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    playing = false; btnPlay.textContent = "▶ Play";
    scrubbing = true;
    playhead = Math.max(0, Math.floor(playhead) - 1);
    scrubber.value = playhead;
    renderAt(playhead);
  });
  document.getElementById("btn-next").addEventListener("click", () => {
    playing = false; btnPlay.textContent = "▶ Play";
    scrubbing = true;
    playhead = Math.min(15, Math.floor(playhead) + 1);
    scrubber.value = playhead;
    renderAt(playhead);
  });
  scrubber.addEventListener("input", () => {
    playing = false; btnPlay.textContent = "▶ Play";
    scrubbing = true;
    playhead = parseFloat(scrubber.value);
    renderAt(playhead);
  });
  scrubber.addEventListener("change", () => { scrubbing = false; });

  document.querySelectorAll(".spd-btn").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".spd-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      speed = parseFloat(b.dataset.spd);
    });
  });

  document.getElementById("btn-export-svg").addEventListener("click", () => {
    const clone = svg.cloneNode(true);
    const ser = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([ser], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fig_a_combat_clash_100cols_r${String(Math.floor(playhead)).padStart(2, "0")}.svg`;
    a.click();
    URL.revokeObjectURL(url);
  });

  let lastTs = performance.now();
  function tick(now) {
    const dt = Math.min(0.08, (now - lastTs) / 1000);
    lastTs = now;
    if (playing) {
      scrubbing = false;
      const rate = (playhead >= 15.0 ? 0.55 : 0.85) * speed;
      playhead += dt * rate;
      if (playhead >= 16.0) playhead = 0.0;
      renderAt(playhead);
    }
    requestAnimationFrame(tick);
  }
  renderAt(1.05);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
